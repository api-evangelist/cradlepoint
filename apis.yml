  - type: SampleCode
    url: https://github.com/cradlepoint/api-samples
- aid: cradlepoint:netcloud-webhooks
  name: Cradlepoint NetCloud Alert Webhooks
  description: >-
    Outbound HTTP destinations (alert_push_destinations) configured via the NCM API or UI to receive real-time
    JSON alert payloads when NCM alert rules fire (router offline, signal degradation, configuration change,
    subscription expiration, threshold breach). Each destination is a URL + optional auth headers; payload
    includes account, router, alert type, timestamp, and contextual metadata.
  humanURL: https://developer.cradlepoint.com/documentation/webhooks
  tags:
  - Webhook
  - Event
  - Alerts
  tags_raw:
  - Webhooks
  - Events
  - Alerts
  properties:
  - type: Documentation
    url: https://developer.cradlepoint.com/documentation/webhooks
  - type: Documentation
    url: https://customer.cradlepoint.com/s/article/NCM-APIv2-Overview
- aid: cradlepoint:netcloud-router-sdk
  name: Cradlepoint NetCloud Router SDK
  description: >-
    On-router Python SDK and toolchain (the "SDK" / "Router SDK") for building and deploying custom applications
    onto Cradlepoint routers running NetCloud OS. Lets developers write Python apps that read router configuration,
    GPIO, GPS, modem signal, and connection state, and that can be packaged and deployed across a fleet
    via NCM. Sample apps in cradlepoint/sdk-samples cover GPS forwarding, modem diagnostics, serial passthrough,
    MQTT publishing, and more.
  humanURL: https://github.com/cradlepoint/sdk-samples
  tags:
  - SDK
  - Edge
  - Python
  - Router
  tags_raw:
  - SDK
  - Edge
  - Python
  - Routers
