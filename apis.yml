apis:
- aid: cradlepoint:netcloud-manager-api-v3
  name: Cradlepoint NetCloud Manager API v3
  description: >-
    The next-generation NetCloud Manager API. Documented with OpenAPI 3.0, authenticated with bearer tokens,
    designed for improved performance, stability, and usability over API v2. Coexists with v2 during a
    multi-year transition window; v3 covers core router, device, alert, group, and account operations.
  humanURL: https://customer.cradlepoint.com/s/article/NetCloud-Manager-API-v3
  tags:
